name: 💡 Feature Request
description: 提出一个新的功能建议
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出功能建议！请详细描述你的想法。

  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题？
      description: 这个功能要解决什么痛点或需求？
      placeholder: 描述你的使用场景...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的功能是什么样的？
      description: 具体描述你希望实现的功能
      placeholder: 描述你期望的行为...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 你考虑过其他实现方式吗？
      placeholder: 描述其他可能的方案...

  - type: textarea
    id: context
    attributes:
      label: 附加上下文（可选）
      description: 任何其他相关信息、截图、链接等

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认事项
      options:
        - label: 这不是已有 Issue 的重复功能请求
          required: true
        - label: 我理解这是一个开源项目，功能是否采纳取决于维护者判断
          required: true
