name: 🐛 Bug Report
description: 报告一个 Bug 帮助我们改进
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢你报告 Bug！请填写以下信息来帮助我们复现和定位问题。

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 简单清晰地描述这个 Bug
      placeholder: 例如：文章详情页无法加载，显示 500 错误
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供详细的重现步骤
      placeholder: |
        1. 进入文章详情页
        2. 点击某篇文章
        3. 页面显示...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望看到什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 问题组件
      options:
        - 前端页面
        - 后端 API
        - 采集系统
        - 部署/运维
        - 其他
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息（可选）
      description: 操作系统、浏览器、Python/Node 版本等
      placeholder: |
        - OS: Windows 11 + WSL2
        - Python: 3.11
        - Node: 20

  - type: textarea
    id: logs
    attributes:
      label: 错误日志（可选）
      description: 如果有错误日志或截图，请粘贴在这里

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认事项
      options:
        - label: 我已确认这不是已知问题
          required: true
        - label: 我提供了足够的复现信息
          required: true
